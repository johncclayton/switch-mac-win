# Deskflow server config for obsidian (Windows) + m6.local (Mac).
# Explicit switching only: no screen links, so the cursor never wanders onto a
# machine the monitor isn't showing. Switch with the hotkeys below (the
# switch-to-*.ps1 scripts press them for you).
# To also allow edge switching, add to section: links
#   obsidian:
#       right = m6.local
#   m6.local:
#       left = obsidian

# Screens (and per-screen options like the Mac's ctrl/alt/super remapping) live
# in Deskflow's GUI config (%APPDATA%\Deskflow\Deskflow.conf), not here:
# Deskflow 1.27 ignores a "section: screens" in this file.

section: links
end

section: options
	heartbeat = 1000
	win32KeepForeground = true
	clipboardSharing = true
	clipboardSharingSize = 3072
	# F11 toggles between the two machines (for you). F10/F12 always go to
	# the Mac/Windows; the scripts and the watcher use those.
	keystroke(Control+Alt+Shift+F11) = switchToNextScreen
	keystroke(Control+Alt+Shift+F10) = switchToScreen(m6.local)
	keystroke(Control+Alt+Shift+F12) = switchToScreen(obsidian)
end
